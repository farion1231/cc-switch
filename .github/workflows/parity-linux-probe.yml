name: Parity Linux probe

# Delivery unit 2 of the parity suite: drive and observe a parity build of CC Switch offline in
# the pinned Linux image, then check every case against its recording. Runs only on parity/**
# branches, never on main or PRs.
on:
  push:
    branches: ["parity/**"]
    paths:
      - "parity/spike/linux/**"
      - "parity/spike/common.mjs"
      - "parity/docker/**"
      - "parity/kit/**"
      - "parity/screens/**"
      - "parity/cases/**"
      - "parity/baseline/**"
      - "parity/seeds/**"
      - "parity/volatile.ts"
      - "parity/ci/**"
      - ".github/workflows/parity-linux-probe.yml"
      - "src-tauri/**"
      - "src/**"

permissions:
  contents: read

concurrency:
  group: parity-linux-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # No Actions cache: the repository's cache quota is shared with main, and a parity build
    # cache would evict main's. Builds start cold.
    env:
      PARITY_RUNS: "7"
    steps:
      - uses: actions/checkout@v6

      - name: Build the lane image
        run: docker build -t ccs-parity-linux:dev -f parity/docker/linux.Dockerfile parity/docker

      - name: Build the parity binary in the image
        env:
          PARITY_CACHE: ${{ runner.temp }}/parity-cache
        run: parity/spike/linux/lane.sh build

      - name: Probe (7 fresh launches, no network)
        env:
          PARITY_CACHE: ${{ runner.temp }}/parity-cache
        run: |
          set -o pipefail
          mkdir -p parity/.out/linux
          parity/spike/linux/lane.sh probe 2>&1 | tee parity/.out/linux/probe.log

      - name: Lint the cases and screen map
        run: parity/spike/linux/lane.sh lint

      # A push whose head commit message asks for a Linux recording records every case; any other
      # push checks every case against the recordings.
      - name: Cases (no network)
        if: always()
        env:
          PARITY_CACHE: ${{ runner.temp }}/parity-cache
          RECORD: ${{ contains(github.event.head_commit.message, '[parity record]') || contains(github.event.head_commit.message, '[parity record linux]') }}
        run: |
          set -o pipefail
          mapfile -t cases < <(find parity/cases -name '*.case.ts' -not -path '*/_scratch/*' | sort)
          mode=check; [ "$RECORD" = "true" ] && mode=record
          parity/spike/linux/lane.sh cases "$mode" "${cases[@]}" 2>&1 | tee parity/.out/linux/cases.log

      - uses: actions/upload-artifact@v4
        if: contains(github.event.head_commit.message, '[parity record]') || contains(github.event.head_commit.message, '[parity record linux]')
        with:
          name: recordings-linux
          path: parity/baseline/**
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          { echo '### Linux'; echo '```'; grep -E '^run |"pass"' parity/.out/linux/probe.log 2>/dev/null || true; grep -E ': (pass|FAIL|recorded|recording REFUSED)' parity/.out/linux/cases.log 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-linux
          path: |
            parity/.out/linux/*.json
            parity/.out/linux/*.png
            parity/.out/linux/probe.log
            parity/.out/linux/cases.log
            parity/.out/linux/cases/**
          retention-days: 7

  # Commits the recordings back to the branch when this push asked for a Linux recording.
  # Every VM must agree. Pushes made with GITHUB_TOKEN start no new workflow runs.
  adopt:
    needs: probe
    if: contains(github.event.head_commit.message, '[parity record]') || contains(github.event.head_commit.message, '[parity record linux]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: recordings-linux
          path: ${{ runner.temp }}/rec
      - name: Adopt the Linux recordings
        run: |
          # The artifact holds the baseline tree at its root.
          parity/ci/adopt-recordings.sh linux "$RUNNER_TEMP/rec/recordings-linux"
