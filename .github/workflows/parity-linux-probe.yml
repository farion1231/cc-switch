name: Parity Linux probe

# Delivery unit 2 of the parity suite: drive and observe a parity build of CC Switch offline in
# the pinned Linux image, then check every case against its recording. Runs only on parity/**
# branches, never on main or PRs.
on:
  push:
    branches: ["parity/**"]
    paths:
      - "parity/spike/linux/**"
      - "parity/spike/common.mjs"
      - "parity/docker/**"
      - "parity/kit/**"
      - "parity/screens/**"
      - "parity/cases/**"
      - "parity/baseline/**"
      - "parity/volatile.ts"
      - ".github/workflows/parity-linux-probe.yml"
      - "src-tauri/**"
      - "src/**"

permissions:
  contents: read

concurrency:
  group: parity-linux-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # No Actions cache: the repository's cache quota is shared with main, and a parity build
    # cache would evict main's. Builds start cold.
    env:
      PARITY_RUNS: "7"
    steps:
      - uses: actions/checkout@v6

      - name: Build the lane image
        run: docker build -t ccs-parity-linux:dev -f parity/docker/linux.Dockerfile parity/docker

      - name: Build the parity binary in the image
        env:
          PARITY_CACHE: ${{ runner.temp }}/parity-cache
        run: parity/spike/linux/lane.sh build

      - name: Probe (7 fresh launches, no network)
        env:
          PARITY_CACHE: ${{ runner.temp }}/parity-cache
        run: |
          set -o pipefail
          mkdir -p parity/.out/linux
          parity/spike/linux/lane.sh probe 2>&1 | tee parity/.out/linux/probe.log

      - name: Cases (compare with the recordings, no network)
        if: always()
        env:
          PARITY_CACHE: ${{ runner.temp }}/parity-cache
        run: |
          set -o pipefail
          mapfile -t cases < <(find parity/cases -name '*.case.ts' -not -path '*/_scratch/*' | sort)
          parity/spike/linux/lane.sh cases check "${cases[@]}" 2>&1 | tee parity/.out/linux/cases.log

      - name: Summary
        if: always()
        run: |
          { echo '### Linux'; echo '```'; grep -E '^run |"pass"' parity/.out/linux/probe.log 2>/dev/null; grep -E ': (pass|FAIL)' parity/.out/linux/cases.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-linux
          path: |
            parity/.out/linux/*.json
            parity/.out/linux/*.png
            parity/.out/linux/probe.log
            parity/.out/linux/cases.log
            parity/.out/linux/cases/**
          retention-days: 7
