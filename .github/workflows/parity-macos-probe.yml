name: Parity macOS probe

# Delivery unit 1 of the parity suite: can a parity build of CC Switch be driven and observed
# on hosted macOS? Runs only on parity/** branches, never on main or PRs.
on:
  push:
    branches: ["parity/**"]
    paths:
      - "parity/spike/macos/**"
      - "parity/spike/common.mjs"
      - "parity/helpers/macos/**"
      - "parity/kit/**"
      - "parity/screens/**"
      - "parity/cases/**"
      - "parity/baseline/**"
      - "parity/volatile.ts"
      - "parity/ci/**"
      - ".github/workflows/parity-macos-probe.yml"
      - "src-tauri/**"
      - "src/**"

permissions:
  contents: read

concurrency:
  group: parity-macos-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build parity app bundle (release profile, feature parity, unsigned)
        run: |
          pnpm tauri build --bundles app --features parity \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
          tar -C src-tauri/target/release/bundle/macos -cf parity-app.tar "CC Switch.app"

      - name: Release build must not contain the WebDriver plugin
        run: |
          cd src-tauri
          if cargo tree -i tauri-plugin-wdio-webdriver --target aarch64-apple-darwin >/dev/null 2>&1; then
            echo "plugin is in the default dependency graph"; exit 1
          fi
          cargo tree -i tauri-plugin-wdio-webdriver --target aarch64-apple-darwin --features parity

      - uses: actions/upload-artifact@v4
        with:
          name: parity-app
          path: parity-app.tar
          retention-days: 3

  probe:
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        vm: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          name: parity-app

      - name: Prepare app and helper
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          tar -C "$RUNNER_TEMP/app" -xf parity-app.tar
          swiftc -O parity/spike/macos/helper.swift -o "$RUNNER_TEMP/parity-helper"
          sw_vers
          system_profiler SPDisplaysDataType | grep -E "Resolution|Retina" || true
          echo "Accessibility trusted: $("$RUNNER_TEMP/parity-helper" trusted)"

      # The parity design denies egress at the OS level on every platform. Without it the
      # updater reaches GitHub and an update badge appears on its own schedule.
      - name: Deny egress except to the runner's own hosts
        run: |
          bash parity/ci/macos-egress.sh start
          bash parity/ci/macos-egress.sh check

      - name: Probe (7 fresh launches)
        env:
          PARITY_OUT_DIR: ${{ runner.temp }}/out
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out"
          node parity/spike/macos/probe.mjs run \
            --app "$RUNNER_TEMP/app/CC Switch.app" \
            --helper "$RUNNER_TEMP/parity-helper" \
            --runs 7 \
            --out "$RUNNER_TEMP/out/results-${{ matrix.vm }}.json" | tee "$RUNNER_TEMP/out/probe.log"

      - name: Restore networking
        if: always()
        run: |
          bash parity/ci/macos-runner-diag.sh
          bash parity/ci/macos-egress.sh stop

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out/crash"
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            find "$d" -type f -newer parity-app.tar 2>/dev/null | while read -r f; do cp "$f" "$RUNNER_TEMP/out/crash/" || true; done
          done
          ls -la "$RUNNER_TEMP/out/crash"

      - name: Summary
        if: always()
        run: |
          { echo '### VM ${{ matrix.vm }}'; echo '```'; tail -40 "$RUNNER_TEMP/out/probe.log" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.vm }}
          path: ${{ runner.temp }}/out
          retention-days: 7

  compare:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: probe-*
      - name: Compare across VMs
        run: |
          set -o pipefail
          node parity/spike/macos/probe.mjs compare probe-*/results-*.json | tee compare.txt
      - name: Summary
        if: always()
        run: |
          { echo '### Across VMs'; echo '```'; cat compare.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The cases, with HOME redirected to a fixed path and real CGEvent input. A push whose head
  # commit message contains "[parity record]" records the macOS variants and uploads them; any
  # other push checks every case 10 times per VM against the recordings.
  cases:
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        vm: [1, 2]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          name: parity-app

      - name: Prepare app and helper
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          tar -C "$RUNNER_TEMP/app" -xf parity-app.tar
          swiftc -O parity/helpers/macos/helper.swift -o "$RUNNER_TEMP/parity-helper"
          echo "Accessibility trusted: $("$RUNNER_TEMP/parity-helper" trusted)"

      - name: Deny egress except to the runner's own hosts
        run: |
          bash parity/ci/macos-egress.sh start
          bash parity/ci/macos-egress.sh check

      - name: Run the cases
        timeout-minutes: 25
        env:
          RECORD: ${{ contains(github.event.head_commit.message, '[parity record]') || contains(github.event.head_commit.message, '[parity record macos]') }}
        run: |
          set -o pipefail
          cases=(); while IFS= read -r f; do cases+=("$f"); done < <(find parity/cases -name '*.case.ts' -not -path '*/_scratch/*' | sort)
          common=(--os macos --app "$RUNNER_TEMP/app/CC Switch.app" --helper "$RUNNER_TEMP/parity-helper" --out "$RUNNER_TEMP/out/cases")
          if [ "$RECORD" = "true" ]; then
            mode=record; list=("${cases[@]}")
          else
            mode=check; list=(); for i in $(seq 10); do list+=("${cases[@]}"); done
          fi
          # The run writes only to a file and the log is printed at the end, so nothing here waits on
          # the runner reading this step's output while egress is denied.
          node parity/kit/internal/cli/main.ts "$mode" "${common[@]}" "${list[@]}" > "$RUNNER_TEMP/out-cases.log" 2>&1 &
          run=$!
          # A hung run stops here with the stacks of what it waited on, instead of keeping pf up until
          # the runner loses its connection and the logs with it. A full check run takes about 9 minutes.
          for _ in $(seq 1200); do kill -0 "$run" 2>/dev/null || break; sleep 1; done
          if kill -0 "$run" 2>/dev/null; then
            hang="$RUNNER_TEMP/out/cases/hang"; mkdir -p "$hang"
            bash parity/ci/macos-egress.sh stop > "$hang/egress.txt" 2>&1 || true
            ps -axo pid,ppid,stat,pcpu,rss,etime,command | grep -E "node|CC Switch|parity-helper|WebKit" | grep -v grep > "$hang/ps.txt" || true
            for p in $(pgrep -f "CC Switch.app/Contents/MacOS/|parity-helper" || true); do
              sample "$p" 5 -file "$hang/sample-$p.txt" >/dev/null 2>&1 || sudo -n sample "$p" 5 -file "$hang/sample-$p.txt" >/dev/null 2>&1 || true
            done
            kill "$run" 2>/dev/null || true
            pkill -f "CC Switch.app/Contents/MacOS/" || true
            cat "$RUNNER_TEMP/out-cases.log" "$hang/ps.txt" "$hang/egress.txt"
            echo "::error::the cases were still running after 20 minutes; see out/cases/hang"
            exit 1
          fi
          status=0; wait "$run" || status=$?
          cat "$RUNNER_TEMP/out-cases.log"
          exit "$status"

      - name: Restore networking
        if: always()
        run: |
          bash parity/ci/macos-runner-diag.sh
          bash parity/ci/macos-egress.sh stop

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out/cases/crash"
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            find "$d" -type f -newer parity-app.tar 2>/dev/null | while read -r f; do cp "$f" "$RUNNER_TEMP/out/cases/crash/" || true; done
          done
          ls -la "$RUNNER_TEMP/out/cases/crash"

      - name: Summary
        if: always()
        run: |
          { echo '### macOS cases, VM ${{ matrix.vm }}'; echo '```'; grep -E ': (pass|FAIL|recorded|recording REFUSED)' "$RUNNER_TEMP/out-cases.log" 2>/dev/null | sort | uniq -c; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cases-macos-${{ matrix.vm }}
          path: |
            ${{ runner.temp }}/out-cases.log
            ${{ runner.temp }}/out/cases/**
            parity/baseline/**
          retention-days: 7

  # Commits the recordings back to the branch when this push asked for a macOS recording.
  # Every VM must agree. Pushes made with GITHUB_TOKEN start no new workflow runs.
  adopt:
    needs: cases
    if: contains(github.event.head_commit.message, '[parity record]') || contains(github.event.head_commit.message, '[parity record macos]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: cases-macos-*
          path: ${{ runner.temp }}/rec
      - name: Adopt the macOS recordings
        run: |
          mapfile -t dirs < <(find "$RUNNER_TEMP/rec" -type d -path '*parity/baseline' | sort)
          echo "recorded by: ${dirs[*]}"
          parity/ci/adopt-recordings.sh macos "${dirs[@]}"
