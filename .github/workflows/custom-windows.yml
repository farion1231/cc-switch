name: Custom Windows MSI

on:
  workflow_dispatch:
  push:
    branches:
      - feat/commandcode-go

permissions:
  contents: write

concurrency:
  group: custom-windows-msi-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: v3.20.4-commandcode-go.2
  RELEASE_NAME: CC Switch v3.20.4 - Command Code Go + Token Plan

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup pnpm
        shell: pwsh
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend type check
        run: pnpm typecheck

      - name: Frontend format check
        run: pnpm format:check

      - name: Normalize Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all

      - name: Command Code bridge tests
        working-directory: src-tauri
        run: cargo test commandcode --lib

      - name: Build Windows x64 MSI
        shell: pwsh
        run: |
          $override = Join-Path $env:RUNNER_TEMP "tauri-msi.json"
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Path $override -Encoding utf8
          pnpm tauri build --bundles msi --config $override

      - name: Stage MSI
        id: stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $msi = Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          $dst = "artifacts\CC-Switch-CommandCode-Go-v3.20.4-x64.msi"
          Copy-Item $msi.FullName $dst
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "MSI: $dst"
          Write-Host "SHA256: $hash"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: CC-Switch-CommandCode-Go-v3.20.4-Windows-x64-MSI
          path: artifacts/CC-Switch-CommandCode-Go-v3.20.4-x64.msi
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.event.head_commit.message, 'release:')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MSI_SHA256: ${{ steps.stage.outputs.sha256 }}
        run: |
          $asset = "artifacts\CC-Switch-CommandCode-Go-v3.20.4-x64.msi"
          $notes = @"
          Custom CC Switch based on official v3.20.4.

          - Native Command Code Go /alpha/generate support for Claude Code
          - Native Command Code Token Plan quota: 5h / weekly / monthly
          - Reuses the provider API key; canonical api.commandcode.ai only
          - Go monthly cap $10; GOAT monthly cap $70
          - 5h/weekly caps use the live API-returned cap; monthly reset uses currentPeriodEnd
          - Real streaming token usage accounting
          - Official Command Code provider icon
          - Yellow-star sponsored presets hidden from Add Provider
          - UI app set reduced to Claude Code / Claude Desktop / Codex
          - Windows x64 MSI only
          - Keeps the official CC Switch product identity / UpgradeCode so it can replace an existing MSI installation
          - Same-version MSI upgrades are supported by the existing WiX template

          SHA-256:
          `$env:MSI_SHA256`
          "@

          if (gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" 2>$null) {
            gh release upload $env:RELEASE_TAG $asset --clobber --repo "${{ github.repository }}"
            gh release edit $env:RELEASE_TAG --title $env:RELEASE_NAME --notes $notes --repo "${{ github.repository }}"
          } else {
            gh release create $env:RELEASE_TAG $asset --target "${{ github.sha }}" --title $env:RELEASE_NAME --notes $notes --repo "${{ github.repository }}"
          }
