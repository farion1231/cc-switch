# CI 用 cargo-nextest 跑后端测试：每个测试一个进程，单个测试卡住时按下面的超时终止，
# 不会拖到整个 job 超时。本地照常用 `cargo test` 也行。

[profile.default]
# 每 60 秒报一次“慢”，第 3 个周期（180 秒）还没结束就终止这个测试
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
# 跑完全部测试再汇总失败
fail-fast = false

# 此测试会启动隔离进程，再通过 where.exe 查找 npm。Windows runner 并发跑全量
# 用例时，进程启动和 PATH 探测曾超过 30 秒；独占测试槽位，避免资源争用。
[[profile.ci.overrides]]
platform = 'cfg(windows)'
filter = 'test(=commands::misc::tool_uninstall::tests::windows_npm_path_fallback_uses_batch_compatible_path)'
threads-required = "num-test-threads"
