[package]
name = "cc-switch-core"
version = "3.18.0"
edition = "2021"
rust-version = "1.85.0"
publish = false

[dependencies]
cc-switch-protocol = { path = "../cc-switch-protocol" }
chrono = "0.4"
indexmap = { version = "2", features = ["serde"] }
rusqlite = { version = "0.31", features = ["backup", "bundled"] }
rust_decimal = "1.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2.0"
toml = "0.8"
toml_edit = "0.22"
json5 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rquickjs = { version = "0.8", features = ["array-buffer", "classes"] }
url = "2.5"
