[package]
name = "cc-switch-core"
version = "3.18.0"
edition = "2021"
rust-version = "1.85.0"
publish = false

[dependencies]
cc-switch-protocol = { path = "../cc-switch-protocol" }
indexmap = { version = "2", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
