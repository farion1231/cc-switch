<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520">
  <defs>
    <style>
      .title { font: 700 22px Segoe UI, Microsoft YaHei, sans-serif; fill: #111827; }
      .sub { font: 400 13px Segoe UI, Microsoft YaHei, sans-serif; fill: #6b7280; }
      .label { font: 600 14px Segoe UI, Microsoft YaHei, sans-serif; fill: #374151; }
      .mono { font: 600 18px Cascadia Mono, Consolas, monospace; fill: #111827; }
      .mono-dim { font: 600 18px Cascadia Mono, Consolas, monospace; fill: #6b7280; }
      .hint { font: 400 12px Segoe UI, Microsoft YaHei, sans-serif; fill: #6b7280; }
      .good { fill: #059669; }
      .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; }
      .head { fill: #f9fafb; }
      .accent { fill: #2563eb; }
      .badge { fill: #ecfdf5; stroke: #a7f3d0; }
    </style>
  </defs>
  <rect width="920" height="520" fill="#f3f4f6"/>
  <text x="40" y="48" class="title">cc-switch tray usage: usage% → usage%-time%</text>
  <text x="40" y="72" class="sub">PR #6339 · feat/tray-usage-time-percent · format demo (unit-tested)</text>

  <!-- Before card -->
  <rect x="40" y="100" width="400" height="280" rx="12" class="card"/>
  <rect x="40" y="100" width="400" height="48" rx="12" class="head"/>
  <rect x="40" y="124" width="400" height="24" class="head"/>
  <text x="60" y="132" class="label">Before · 仅用量%</text>
  <text x="60" y="180" class="mono-dim">Claude · Claude Official</text>
  <text x="60" y="220" class="mono">🟢 h3% w39%</text>
  <text x="60" y="260" class="hint">看不出窗口时间进度：</text>
  <text x="60" y="282" class="hint">用量 39% 时，时间走了 10% 还是 90%？</text>
  <text x="60" y="320" class="hint">无法判断是否“烧得比时间快”。</text>

  <!-- After card -->
  <rect x="480" y="100" width="400" height="280" rx="12" class="card"/>
  <rect x="480" y="100" width="400" height="48" rx="12" class="head"/>
  <rect x="480" y="124" width="400" height="24" class="head"/>
  <text x="500" y="132" class="label">After · 用量%-时间%</text>
  <text x="500" y="180" class="mono-dim">Claude · Claude Official</text>
  <text x="500" y="220" class="mono good">🟢 h3%-37% w39%-70%</text>
  <rect x="500" y="248" width="340" height="70" rx="8" class="badge"/>
  <text x="516" y="276" class="hint">h：5h 窗 · 用量 3% / 时间已过 37%</text>
  <text x="516" y="298" class="hint">w：7d 窗 · 用量 39% / 时间已过 70%</text>
  <text x="500" y="350" class="hint">语义对齐 vscode-gptx：usage%-time%</text>

  <text x="40" y="430" class="sub">Fallback（无 resets_at，如部分 Gemini 档）：仍显示 h3% w39%，不编造时间%。</text>
  <text x="40" y="458" class="sub">Frontend tests: tests/utils/quotaWindow.test.ts — 4/4 passed</text>
  <text x="40" y="486" class="sub">Tray format helpers covered by cargo tray::tests (run when Rust toolchain available)</text>
</svg>